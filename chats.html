<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UmbrellaNet – Chats</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">

  <style>
    :root{
      --bg:#1c1a2e; --primary:#5E185B; --accent:#EBB2E6; --red:#ef4444;
      --muted:#2b2b44; --text:#f1e6f9; --card:#2a2740;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    body{margin:0;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;}
    .app{display:grid;grid-template-columns:260px 300px 1fr;height:100vh;}

    /* ── Menu ── */
    .sidebar{background:var(--card);border-right:1px solid #333;display:flex;flex-direction:column;padding:20px;overflow:hidden;}
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}
    .logo{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
    .logo-img{width:60px;height:60px;object-fit:contain;}
    .brand h1{font-size:18px;margin:0;color:#fff}
    .brand .sub{font-size:12px;color:#fff}
    .nav{display:flex;flex-direction:column;gap:8px;margin-top:10px;overflow-y:auto;}
    .nav a{color:var(--text);text-decoration:none;padding:10px;border-radius:8px;display:flex;align-items:center}
    .nav a:hover{background:var(--muted)}
    .nav a.active{background:var(--primary);color:#fff}
    #missedBadge{background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:none;align-items:center;justify-content:center;margin-left:auto;padding:0 5px}
    .find{margin-top:auto;}
    .find input{width:100%;padding:8px;border-radius:8px;border:1px solid #444;background:var(--bg);color:var(--text);margin-bottom:8px;box-sizing:border-box;}
    .find button{width:100%;padding:8px;border-radius:8px;border:0;background:var(--primary);color:#fff;cursor:pointer}

    /* ── Session list ── */
    .chat-list{background:var(--card);border-right:1px solid #333;display:flex;flex-direction:column;overflow:hidden;}
    .chat-list-header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;flex-shrink:0;}
    .chat-list-header h2{font-size:16px;margin:0;}
    .refresh-btn{background:none;border:1px solid #444;color:var(--text);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;}
    .refresh-btn:hover{background:var(--muted);}
    .chat-list-scroll{overflow-y:auto;flex:1;}
    .chat-item{padding:12px 16px;border-bottom:1px solid #333;cursor:pointer;display:flex;flex-direction:column;}
    .chat-item:hover{background:var(--muted)}
    .chat-item.active{background:var(--primary);color:#fff}
    .chat-name{font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;overflow-wrap:anywhere}
    .session-badge{font-size:10px;background:#333;color:#aaa;padding:1px 5px;border-radius:4px;font-weight:400;}
    .chat-item.active .session-badge{background:rgba(255,255,255,0.2);color:#eee;}
    .chat-preview{font-size:13px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .chat-item.active .chat-preview{color:#ddd;}
    .chat-time{font-size:11px;color:#999;align-self:flex-end;margin-top:2px}
    .chat-item.active .chat-time{color:#ddd;}

    /* ── Conversation ── */
    .main{display:flex;flex-direction:column;overflow:hidden;}
    .topbar{background:var(--card);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #333;flex-shrink:0;}
    .topbar .hint{font-size:12px;color:#999}
    .chat-main{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,#211f38,#1c1a2e)}
    .message{max-width:70%;padding:12px 14px;border-radius:12px;line-height:1.5;overflow-wrap:anywhere;}
    .user{align-self:flex-start;background:var(--muted);color:var(--text)}
    .bot{align-self:flex-end;background:var(--accent);color:#fff}
    .message-content p{margin:0 0 0.6em 0;}
    .message-content p:last-child{margin-bottom:0;}
    .role-label{font-size:10px;opacity:.65;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px;}
    .message-status{font-size:11px;margin-top:4px;text-align:right;}
    .date-divider{text-align:center;color:#aaa;font-size:12px;margin:16px 0;position:relative;}
    .date-divider::before,.date-divider::after{content:'';position:absolute;top:50%;width:30%;height:1px;background:#444;}
    .date-divider::before{left:0;}.date-divider::after{right:0;}
    .status-message{text-align:center;color:#aaa;font-style:italic;margin:10px 0;padding:0 12px}
    .status-message.error{color:#ff8a8a;font-style:normal}
    .loading-dots{display:flex;gap:4px;align-items:center;justify-content:center;padding:24px;}
    .loading-dots span{width:7px;height:7px;border-radius:50%;background:#888;animation:db 1.4s infinite ease-in-out;}
    .loading-dots span:nth-child(2){animation-delay:.2s;}
    .loading-dots span:nth-child(3){animation-delay:.4s;}
    @keyframes db{0%,80%,100%{transform:scale(.8);opacity:.4;}40%{transform:scale(1.2);opacity:1;}}
    @media(max-width:1000px){.app{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<div class="app">

  <!-- ── Menu ── -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><img src="img/logo.svg" alt="" class="logo-img"></div>
      <div>
        <h1>UmbrellaNet</h1>
        <div class="sub">Admin Dashboard</div>
      </div>
    </div>
    <nav class="nav">
      <a href="chats.html" class="active">Chats</a>
      <a href="analytics.html">Analytics</a>
      <a href="agent.html">Agent</a>
      <a href="missed.html">Missed Agent Requests <span id="missedBadge">0</span></a>
      <a href="index2.html">Dashboard</a>
    </nav>
    <div class="find">
      <input id="findInput" placeholder="Find session by ID" />
      <button id="findBtn">Find Session</button>
    </div>
  </aside>

  <!-- ── Session list ── -->
  <aside class="chat-list">
    <div class="chat-list-header">
      <h2>Sessions</h2>
      <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
    </div>
    <div class="chat-list-scroll" id="chatList">
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
  </aside>

  <!-- ── Conversation (read only) ── -->
  <div class="main">
    <div class="topbar">
      <strong id="chatTitle">Sessions</strong>
      <span class="hint">Read only</span>
    </div>
    <section class="chat-main" id="chatMain">
      <div class="status-message" style="margin-top:60px;">Select a session to view messages</div>
    </section>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/api.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/missed-badge.js"></script>

<script>
  const $chatMain  = document.getElementById('chatMain');
  const $chatList  = document.getElementById('chatList');
  const $chatTitle = document.getElementById('chatTitle');
  const $refresh   = document.getElementById('refreshBtn');
  const $findInput = document.getElementById('findInput');
  const $findBtn   = document.getElementById('findBtn');

  const LOADING = '<div class="loading-dots"><span></span><span></span><span></span></div>';

  let sessions = [];        // rows from the server: { ip_hash, session_id, message_count, last_at, last_text }
  let openRequest = 0;      // lets us ignore a slow answer after the admin has clicked another session

  requireSignIn(() => {
    startMissedBadge();
    loadSessions();
  });

  // ─── Session list ────────────────────────────────────────────────────────────
  async function loadSessions() {
    $chatList.innerHTML = LOADING;
    try {
      const data = await api('/api/admin/sessions');
      sessions = data.sessions || [];

      if (!sessions.length) {
        $chatList.innerHTML = '<div class="status-message">No sessions found</div>';
        return;
      }

      $chatList.innerHTML = '';
      sessions.forEach((s, i) => $chatList.appendChild(buildItem(s, i)));
      if (sessions.length >= 300) {
        $chatList.insertAdjacentHTML('beforeend', '<div class="status-message">Showing the 300 most recent sessions</div>');
      }
      openSession(0);
    } catch (err) {
      showListError(err);
    }
  }

  function buildItem(s, index) {
    const preview = s.last_text ? (s.last_text.length > 32 ? s.last_text.slice(0, 32) + '…' : s.last_text) : 'No messages';
    const item = document.createElement('div');
    item.className = 'chat-item';
    item.dataset.index = index;
    item.innerHTML = `
      <div class="chat-name">
        ${esc(s.session_id)}
        <span class="session-badge">${s.message_count} msg</span>
      </div>
      <div class="chat-preview">${esc(preview)}</div>
      <div class="chat-time">IP: ${esc(s.ip_hash.slice(0, 8))}… · ${esc(shortDateTime(s.last_at))}</div>
    `;
    item.addEventListener('click', () => openSession(index));
    return item;
  }

  function showListError(err) {
    console.error(err);
    const msg = err.status === 403 ? 'Your account is not approved to view chats.' : `Error: ${err.message}`;
    $chatList.innerHTML = `<div class="status-message error">${esc(msg)}</div>`;
  }

  // ─── Open a session ──────────────────────────────────────────────────────────
  async function openSession(index) {
    const s = sessions[index];
    if (!s) return;

    document.querySelectorAll('.chat-item').forEach(el => el.classList.toggle('active', el.dataset.index === String(index)));
    $chatTitle.textContent = `Session: ${s.session_id}`;
    $chatMain.innerHTML = LOADING;

    const thisRequest = ++openRequest;
    try {
      const qs = new URLSearchParams({ ip_hash: s.ip_hash, session_id: s.session_id });
      const data = await api('/api/admin/messages?' + qs.toString());
      if (thisRequest !== openRequest) return;      // another session was opened meanwhile
      renderMessages(data.messages || []);
    } catch (err) {
      if (thisRequest !== openRequest) return;
      console.error(err);
      $chatMain.innerHTML = `<div class="status-message error">${esc('Error: ' + err.message)}</div>`;
    }
  }

  function renderMessages(messages) {
    $chatMain.innerHTML = '';
    if (!messages.length) {
      $chatMain.innerHTML = '<div class="status-message">No messages in this session</div>';
      return;
    }

    let lastDate = null;
    messages.forEach(m => {
      const when = new Date(m.created_at);
      const dateStr = when.toDateString();
      if (dateStr !== lastDate) {
        const d = document.createElement('div');
        d.className = 'date-divider';
        d.textContent = dateLabel(dateStr);
        $chatMain.appendChild(d);
        lastDate = dateStr;
      }

      const isUser = m.role === 'user';
      const div = document.createElement('div');
      div.className = `message ${isUser ? 'user' : 'bot'}`;
      div.innerHTML = `
        <div class="role-label">${isUser ? '👤 User' : '🤖 Assistant'}</div>
        <div class="message-content">${formatMessageText(m.text)}</div>
        <div class="message-status" style="color:${isUser ? '#999' : 'rgba(255,255,255,0.7)'};">${esc(when.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))}</div>
      `;
      $chatMain.appendChild(div);
    });
    $chatMain.scrollTop = $chatMain.scrollHeight;
  }

  // ─── Find session ────────────────────────────────────────────────────────────
  $findBtn.addEventListener('click', () => {
    const val = $findInput.value.trim().toLowerCase();
    if (!val) return;
    let index = sessions.findIndex(s => s.session_id.toLowerCase() === val);
    if (index === -1) index = sessions.findIndex(s => s.session_id.toLowerCase().includes(val));
    if (index === -1) {
      alert(`No session found with ID: ${$findInput.value.trim()}`);
    } else {
      openSession(index);
      const item = $chatList.querySelector(`.chat-item[data-index="${index}"]`);
      if (item) item.scrollIntoView({ block: 'nearest' });
    }
    $findInput.value = '';
  });
  $findInput.addEventListener('keypress', e => { if (e.key === 'Enter') $findBtn.click(); });
  $refresh.addEventListener('click', loadSessions);

  // ─── Helpers ─────────────────────────────────────────────────────────────────
  // Escape first, then turn blank lines into paragraphs and single line breaks into <br>
  function formatMessageText(text) {
    const paragraphs = esc(text || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    if (!paragraphs.length) return '';
    return paragraphs.map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function shortDateTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function dateLabel(ds) {
    const today = new Date().toDateString();
    const yest  = new Date(Date.now() - 86400000).toDateString();
    if (ds === today) return 'Today';
    if (ds === yest)  return 'Yesterday';
    return new Date(ds).toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }
</script>
</body>
</html>
